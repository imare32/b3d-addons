schema_version = "1.0.0"

id = "gen_celtic"
version = "0.2.0"
name = "Gen Celtic"
tagline = "Weave any mesh into an interlaced Celtic knot curve"
maintainer = "imare32"
type = "add-on"

tags = ["Mesh", "Object", "Geometry Nodes"]

# 实测 5.2.2：算法层手写顶点环绕（5.x 的 BMLoop.link_loops 语义与 4.x 不同），
