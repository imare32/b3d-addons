schema_version = "1.0.0"

id = "gen_voronoi"
version = "0.1.0"
name = "Gen Voronoi"
tagline = "Live 2D Voronoi cells drawn as Grease Pencil strokes"
maintainer = "imare32"
type = "add-on"

tags = ["Grease Pencil", "Object"]

# GP v3 的 drawing 属性（position / radius / vertex_color / fill_id）与编辑模式下的
