schema_version = "1.0.0"

id = "gen_imaginary_base"
version = "0.4.1"
name = "Gen Imaginary Base"
tagline = "Self-affine point sets from imaginary-base numeral systems"
maintainer = "imare32"
type = "add-on"

tags = ["Grease Pencil", "Object"]

# 输出走 Grease Pencil v3（``frame.drawing`` + 点域属性层，4.3 才有）。4.2 的
# ``bpy.data.grease_pencils`` 是旧版 GP，没有 drawing / attributes，实测直接崩，
# 所以下限是 4.3 而不是 4.2。HUD 只用 gpu / blf 的稳定接口。
blender_version_min = "4.3.0"

license = ["SPDX:GPL-3.0-or-later"]

# 不申请任何权限：本插件只读剪贴板以外的输入（没有剪贴板、没有文件访问），
# 点数预算、点半径这些偏好都走 Blender 自己的偏好文件。

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.gitignore",
    "/.vscode/",
    "/.temp/",
    "/*.zip",
]
